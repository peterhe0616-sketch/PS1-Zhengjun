<text x="840.0" y="32.1" font-size="15.0" fill="#0B5C55" font-weight="700" text-anchor="middle">Behavioral science</text>
<text x="840.0" y="51.4" font-size="10.0" fill="#0B5C55" font-weight="400" font-style="italic" text-anchor="middle">Honesty, justification and over-trust</text>
<rect x="705.0" y="60.0" width="270.0" height="38.0" rx="2.3" ry="2.3" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="76.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Justification account:</text>
<text x="840.0" y="88.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">dishonesty grows with excuses</text>
<rect x="705.0" y="104.0" width="270.0" height="38.0" rx="2.3" ry="2.3" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="120.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Moral licensing (competing):</text>
<text x="840.0" y="132.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">easy checking may reduce scrutiny</text>
<rect x="705.0" y="148.0" width="270.0" height="40.0" rx="2.4" ry="2.4" fill="#D3EFEB" stroke="#14877D" stroke-width="2.0"/>
<text x="840.0" y="165.0" font-size="11.0" fill="#0B5C55" font-weight="700" text-anchor="middle">They separate on</text>
<text x="840.0" y="178.5" font-size="11.0" fill="#0B5C55" font-weight="700" text-anchor="middle">verifier attention</text>
<rect x="705.0" y="194.0" width="270.0" height="36.0" rx="2.2" ry="2.2" fill="#E9F6F4" stroke="#14877D" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="840.0" y="209.3" font-size="10.0" fill="#0B5C55" font-weight="400" text-anchor="middle">Risk: over-trust migrating from</text>
<text x="840.0" y="221.5" font-size="10.0" fill="#0B5C55" font-weight="400" text-anchor="middle">AI outputs to AI-generated evidence</text>
<rect x="705.0" y="236.0" width="270.0" height="50.0" rx="3.0" ry="3.0" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="258.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Next test: cross trace-file presence</text>
<text x="840.0" y="270.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">with verifier scrutiny depth</text>
<rect x="705.0" y="292.0" width="270.0" height="34.0" rx="2.0" ry="2.0" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="713.0" y="312.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Shalvi et al. (2012)</text>
<text x="330.0" y="178.1" font-size="9.0" fill="#8A5A00" font-weight="400" text-anchor="middle">motivates</text>
<text x="670.0" y="178.1" font-size="9.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">enables</text>
<text x="500.0" y="359.4" font-size="10.0" fill="#666666" font-weight="400" font-style="italic" text-anchor="middle">Each column states one discipline, its mechanism, and the works cited for it. Solid boxes are established relations; dashed boxes and dashed arrows are the proposed synthesis. All values are simulated under the payoff law in the Colab notebook.</text>
