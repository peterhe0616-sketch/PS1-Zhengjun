<svg xmlns="http://www.w3.org/2000/svg" width="1000.0" height="440.0" viewBox="0 0 1000.0 440.0" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1000.0" height="440.0" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
<rect x="10.0" y="10.0" width="300.0" height="390.0" rx="12.0" ry="12.0" fill="#FFF4E6" stroke="#D79B00" stroke-width="2.0"/>
<text x="160.0" y="37.1" font-size="15.0" fill="#8A5A00" font-weight="700" text-anchor="middle">Economics</text>
<text x="160.0" y="58.4" font-size="10.0" fill="#8A5A00" font-weight="400" font-style="italic" text-anchor="middle">Market failure under forgeable evidence</text>
<text x="160.0" y="82.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Generation is near-free.</text>
<text x="160.0" y="95.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Verification is expensive.</text>
<rect x="35.0" y="108.0" width="250.0" height="42.0" rx="2.5" ry="2.5" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="160.0" y="126.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Buyers cannot observe</text>
<text x="160.0" y="139.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">quality before purchase</text>
<rect x="35.0" y="158.0" width="250.0" height="42.0" rx="2.5" ry="2.5" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="160.0" y="176.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Cheap signals substitute:</text>
<text x="160.0" y="189.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">identity, adoption counts</text>
<rect x="35.0" y="208.0" width="250.0" height="42.0" rx="2.5" ry="2.5" fill="#FFE9C7" stroke="#D79B00" stroke-width="2.0"/>
<text x="160.0" y="226.0" font-size="11.0" fill="#8A5A00" font-weight="700" text-anchor="middle">Two mechanisms</text>
<text x="160.0" y="239.5" font-size="11.0" fill="#8A5A00" font-weight="700" text-anchor="middle">FINE  pF   and   PREMIUM  Δ</text>
<rect x="35.0" y="258.0" width="250.0" height="40.0" rx="2.4" ry="2.4" fill="#FFF4E6" stroke="#D79B00" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="160.0" y="275.3" font-size="10.0" fill="#B34700" font-weight="400" text-anchor="middle">Unresolved: when the</text>
<text x="160.0" y="287.5" font-size="10.0" fill="#B34700" font-weight="400" text-anchor="middle">evidence itself can be forged</text>
<rect x="35.0" y="310.0" width="250.0" height="76.0" rx="4.6" ry="4.6" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="43.0" y="334.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Akerlof (1970)</text>
<text x="43.0" y="345.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Spence (1973)</text>
<text x="43.0" y="356.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Nash (1950)</text>
<text x="43.0" y="367.5" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Mäkimattila et al. (2025)</text>
<rect x="350.0" y="10.0" width="300.0" height="390.0" rx="12.0" ry="12.0" fill="#E8F1FB" stroke="#315EFB" stroke-width="2.0"/>
<text x="500.0" y="37.1" font-size="15.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">Computer science</text>
<text x="500.0" y="58.4" font-size="10.0" fill="#1B3A9E" font-weight="400" font-style="italic" text-anchor="middle">Machine-checkable trace file and verifier</text>
<rect x="365.0" y="70.0" width="270.0" height="26.0" rx="1.6" ry="1.6" fill="#D6E6FF" stroke="#315EFB" stroke-width="1.0"/>
<text x="500.0" y="86.8" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">PER-CLAIM TRACE FILE</text>
<rect x="365.0" y="102.0" width="270.0" height="74.0" rx="4.4" ry="4.4" fill="#FFFFFF" stroke="#315EFB" stroke-width="1.0"/>
<text x="500.0" y="124.1" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">claim id</text>
<text x="500.0" y="136.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">source link</text>
<text x="500.0" y="148.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">dataset version</text>
<text x="500.0" y="160.7" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">input / output value</text>
<rect x="365.0" y="184.0" width="270.0" height="38.0" rx="2.3" ry="2.3" fill="#FFFFFF" stroke="#315EFB" stroke-width="1.0"/>
<text x="500.0" y="200.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">content-addressed sources</text>
<text x="500.0" y="212.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">(hash, not URL)</text>
<rect x="365.0" y="232.0" width="270.0" height="52.0" rx="3.1" ry="3.1" fill="#D6E6FF" stroke="#315EFB" stroke-width="1.0"/>
<text x="500.0" y="248.3" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">ONE-CLICK VERIFIER</text>
<text x="500.0" y="261.8" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">recompute the declared value,</text>
<text x="500.0" y="275.2" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">compare:  pass / fail</text>
<rect x="365.0" y="292.0" width="270.0" height="38.0" rx="2.3" ry="2.3" fill="#E8F1FB" stroke="#315EFB" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="500.0" y="308.3" font-size="10.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">Build layer exists (SLSA).</text>
<text x="500.0" y="320.5" font-size="10.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">The claim layer is the contribution.</text>
<rect x="365.0" y="340.0" width="270.0" height="46.0" rx="2.8" ry="2.8" fill="#FFFFFF" stroke="#315EFB" stroke-width="1.0"/>
<text x="373.0" y="355.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Buneman et al. (2001)</text>
<text x="373.0" y="366.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">SLSA specification v1.2</text>
<text x="373.0" y="377.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">CKAN 2.11</text>
<rect x="690.0" y="10.0" width="300.0" height="390.0" rx="12.0" ry="12.0" fill="#E9F6F4" stroke="#14877D" stroke-width="2.0"/>
<text x="840.0" y="37.1" font-size="15.0" fill="#0B5C55" font-weight="700" text-anchor="middle">Behavioral science</text>
<text x="840.0" y="58.4" font-size="10.0" fill="#0B5C55" font-weight="400" font-style="italic" text-anchor="middle">Honesty, justification and over-trust</text>
<rect x="705.0" y="70.0" width="270.0" height="42.0" rx="2.5" ry="2.5" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="88.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Justification account:</text>
<text x="840.0" y="100.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">dishonesty grows with excuses</text>
<rect x="705.0" y="120.0" width="270.0" height="42.0" rx="2.5" ry="2.5" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="138.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Moral licensing (competing):</text>
<text x="840.0" y="150.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">easy checking may reduce scrutiny</text>
<rect x="705.0" y="170.0" width="270.0" height="44.0" rx="2.6" ry="2.6" fill="#D3EFEB" stroke="#14877D" stroke-width="2.0"/>
<text x="840.0" y="189.0" font-size="11.0" fill="#0B5C55" font-weight="700" text-anchor="middle">They separate on</text>
<text x="840.0" y="202.5" font-size="11.0" fill="#0B5C55" font-weight="700" text-anchor="middle">verifier attention</text>
<rect x="705.0" y="222.0" width="270.0" height="40.0" rx="2.4" ry="2.4" fill="#E9F6F4" stroke="#14877D" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="840.0" y="239.3" font-size="10.0" fill="#0B5C55" font-weight="400" text-anchor="middle">Risk: over-trust migrating from</text>
<text x="840.0" y="251.5" font-size="10.0" fill="#0B5C55" font-weight="400" text-anchor="middle">AI outputs to AI-generated evidence</text>
<rect x="705.0" y="270.0" width="270.0" height="60.0" rx="3.6" ry="3.6" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="840.0" y="297.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">Next test: cross trace-file presence</text>
<text x="840.0" y="309.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">with verifier scrutiny depth</text>
<rect x="705.0" y="340.0" width="270.0" height="46.0" rx="2.8" ry="2.8" fill="#FFFFFF" stroke="#14877D" stroke-width="1.0"/>
<text x="713.0" y="366.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Shalvi et al. (2012)</text>
<text x="330.0" y="208.1" font-size="9.0" fill="#8A5A00" font-weight="400" text-anchor="middle">motivates</text>
<text x="670.0" y="208.1" font-size="9.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">enables</text>
<text x="500.0" y="424.4" font-size="10.0" fill="#666666" font-weight="400" font-style="italic" text-anchor="middle">Each column states one discipline, its mechanism, and the works cited for it. Solid boxes are established relations; dashed boxes and dashed arrows are the proposed synthesis. All values are simulated under the payoff law in the Colab notebook.</text>
