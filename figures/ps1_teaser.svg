<rect x="10.0" y="8.0" width="300.0" height="330.0" rx="12.0" ry="12.0" fill="#FFF4E6" stroke="#D79B00" stroke-width="2.0"/>
<text x="160.0" y="32.1" font-size="15.0" fill="#8A5A00" font-weight="700" text-anchor="middle">Economics</text>
<text x="160.0" y="51.4" font-size="10.0" fill="#8A5A00" font-weight="400" font-style="italic" text-anchor="middle">Market failure under forgeable evidence</text>
<text x="160.0" y="71.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Generation is near-free.</text>
<text x="160.0" y="84.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Verification is expensive.</text>
<rect x="35.0" y="94.0" width="250.0" height="38.0" rx="2.3" ry="2.3" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="160.0" y="110.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Buyers cannot observe</text>
<text x="160.0" y="123.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">quality before purchase</text>
<rect x="35.0" y="138.0" width="250.0" height="38.0" rx="2.3" ry="2.3" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="160.0" y="154.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Cheap signals substitute:</text>
<text x="160.0" y="167.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">identity, adoption counts</text>
<rect x="35.0" y="182.0" width="250.0" height="38.0" rx="2.3" ry="2.3" fill="#FFE9C7" stroke="#D79B00" stroke-width="2.0"/>
<text x="160.0" y="198.0" font-size="11.0" fill="#8A5A00" font-weight="700" text-anchor="middle">Two mechanisms</text>
<text x="160.0" y="211.5" font-size="11.0" fill="#8A5A00" font-weight="700" text-anchor="middle">FINE  pF   and   PREMIUM  Δ</text>
<rect x="35.0" y="226.0" width="250.0" height="36.0" rx="2.2" ry="2.2" fill="#FFF4E6" stroke="#D79B00" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="160.0" y="241.3" font-size="10.0" fill="#B34700" font-weight="400" text-anchor="middle">Unresolved: when the</text>
<text x="160.0" y="253.5" font-size="10.0" fill="#B34700" font-weight="400" text-anchor="middle">evidence itself can be forged</text>
<rect x="35.0" y="270.0" width="250.0" height="60.0" rx="3.6" ry="3.6" fill="#FFFFFF" stroke="#D79B00" stroke-width="1.0"/>
<text x="43.0" y="286.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Akerlof (1970)</text>
<text x="43.0" y="297.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Spence (1973)</text>
<text x="43.0" y="308.6" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Nash (1950)</text>
<text x="43.0" y="319.5" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Mäkimattila et al. (2025)</text>
<rect x="350.0" y="8.0" width="300.0" height="330.0" rx="12.0" ry="12.0" fill="#E8F1FB" stroke="#315EFB" stroke-width="2.0"/>
<text x="500.0" y="32.1" font-size="15.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">Computer science</text>
<text x="500.0" y="51.4" font-size="10.0" fill="#1B3A9E" font-weight="400" font-style="italic" text-anchor="middle">Machine-checkable trace file and verifier</text>
