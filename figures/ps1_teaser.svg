<svg xmlns="http://www.w3.org/2000/svg" width="900.0" height="260.0" viewBox="0 0 900.0 260.0" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900.0" height="260.0" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker></defs>
<rect x="10.0" y="8.0" width="280.0" height="214.0" rx="8.6" ry="8.6" fill="#FFF4E6" stroke="#D79B00" stroke-width="2.0"/>
<text x="150.0" y="31.8" font-size="14.0" fill="#8A5A00" font-weight="700" text-anchor="middle">Economics</text>
<text x="150.0" y="59.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Generation is free,</text>
<text x="150.0" y="72.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">verification is costly</text>
<text x="150.0" y="101.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Buyers cannot observe</text>
<text x="150.0" y="114.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">quality, so faking pays</text>
<rect x="30.0" y="130.0" width="240.0" height="30.0" rx="1.8" ry="1.8" fill="#FFE9C7" stroke="#D79B00" stroke-width="2.0"/>
<text x="150.0" y="149.1" font-size="12.0" fill="#8A5A00" font-weight="700" text-anchor="middle">FINE pF    or    PREMIUM Δ</text>
<text x="150.0" y="190.6" font-size="9.0" fill="#8A5A00" font-weight="400" text-anchor="middle">Akerlof (1970) · Spence (1973)</text>
<text x="150.0" y="201.6" font-size="9.0" fill="#8A5A00" font-weight="400" text-anchor="middle">Nash (1950) · Mäkimattila et al. (2025)</text>
<rect x="310.0" y="8.0" width="280.0" height="214.0" rx="8.6" ry="8.6" fill="#E8F1FB" stroke="#315EFB" stroke-width="2.0"/>
<text x="450.0" y="31.8" font-size="14.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">Computer science</text>
<text x="450.0" y="59.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">A per-claim trace file:</text>
<text x="450.0" y="72.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">source, version, value</text>
<text x="450.0" y="101.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">A verifier recomputes</text>
<text x="450.0" y="114.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">and returns pass or fail</text>
<rect x="330.0" y="130.0" width="240.0" height="30.0" rx="1.8" ry="1.8" fill="#D6E6FF" stroke="#315EFB" stroke-width="2.0"/>
<text x="450.0" y="149.1" font-size="12.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">CLAIM LAYER</text>
<text x="450.0" y="196.1" font-size="9.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">Buneman et al. (2001) · SLSA v1.2 · CKAN 2.11</text>
<rect x="610.0" y="8.0" width="280.0" height="214.0" rx="8.6" ry="8.6" fill="#E9F6F4" stroke="#14877D" stroke-width="2.0"/>
<text x="750.0" y="31.8" font-size="14.0" fill="#0B5C55" font-weight="700" text-anchor="middle">Behavioral science</text>
<text x="750.0" y="59.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">Excuses raise dishonesty,</text>
<text x="750.0" y="72.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">so trace should reduce it</text>
<text x="750.0" y="101.0" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">But easy checking may</text>
<text x="750.0" y="114.5" font-size="11.0" fill="#333333" font-weight="400" text-anchor="middle">breed over-trust instead</text>
<rect x="630.0" y="130.0" width="240.0" height="30.0" rx="1.8" ry="1.8" fill="#D3EFEB" stroke="#14877D" stroke-width="2.0"/>
<text x="750.0" y="148.8" font-size="11.0" fill="#0B5C55" font-weight="700" text-anchor="middle">TESTED ON THE FAKE RATE</text>
<text x="750.0" y="196.1" font-size="9.0" fill="#0B5C55" font-weight="400" text-anchor="middle">Shalvi et al. (2012)</text>
<text x="301.0" y="118.1" font-size="9.0" fill="#8A5A00" font-weight="400" text-anchor="middle">needs</text>
<text x="606.0" y="118.1" font-size="9.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">shapes</text>
<text x="450.0" y="243.1" font-size="9.0" fill="#666666" font-weight="400" font-style="italic" text-anchor="middle">Dashed arrows mark the proposed synthesis. Values are simulated.</text>
<line x1="290.0" y1="115.0" x2="310.0" y2="115.0" stroke="#8A5A00" stroke-width="2.0" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="115.0" x2="610.0" y2="115.0" stroke="#1B3A9E" stroke-width="2.0" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
</svg>