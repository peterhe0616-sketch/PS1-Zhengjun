<text x="500.0" y="109.1" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">claim id</text>
<text x="500.0" y="121.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">source link</text>
<text x="500.0" y="133.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">dataset version</text>
<text x="500.0" y="145.7" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">input / output value</text>
