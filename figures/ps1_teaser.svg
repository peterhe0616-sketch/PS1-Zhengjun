<text x="500.0" y="178.3" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">content-addressed sources</text>
<text x="500.0" y="190.5" font-size="10.0" fill="#333333" font-weight="400" text-anchor="middle">(hash, not URL)</text>
<rect x="365.0" y="204.0" width="270.0" height="46.0" rx="2.8" ry="2.8" fill="#D6E6FF" stroke="#315EFB" stroke-width="1.0"/>
<text x="500.0" y="217.3" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">ONE-CLICK VERIFIER</text>
<text x="500.0" y="230.8" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">recompute the declared value,</text>
<text x="500.0" y="244.2" font-size="11.0" fill="#1B3A9E" font-weight="700" text-anchor="middle">compare:  pass / fail</text>
<rect x="365.0" y="256.0" width="270.0" height="34.0" rx="2.0" ry="2.0" fill="#E8F1FB" stroke="#315EFB" stroke-width="1.0" stroke-dasharray="5,4"/>
<text x="500.0" y="270.3" font-size="10.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">Build layer exists (SLSA).</text>
<text x="500.0" y="282.5" font-size="10.0" fill="#1B3A9E" font-weight="400" text-anchor="middle">The claim layer is the contribution.</text>
<rect x="365.0" y="296.0" width="270.0" height="34.0" rx="2.0" ry="2.0" fill="#FFFFFF" stroke="#315EFB" stroke-width="1.0"/>
<text x="373.0" y="305.1" font-size="9.0" fill="#666666" font-weight="400" text-anchor="start">Buneman et al. (2001)</text>
